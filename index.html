<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a1424">
<title>합주 연습 플레이어</title>
<style>
:root{
  --bg:#0a1424; --bg2:#0e1c30; --panel:#122338; --panel2:#16293f;
  --line:#1e3550; --text:#e8f0fb; --muted:#93a9c4; --accent:#2f86d8; --accent2:#1fa8a0;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",system-ui,"Segoe UI",sans-serif;font-size:14px;line-height:1.35;-webkit-text-size-adjust:100%;overscroll-behavior:none;display:flex;flex-direction:column;overflow:hidden}
button,input,select{font:inherit;color:inherit}
header{flex:0 0 auto;display:flex;align-items:center;gap:7px;padding:7px 10px;background:linear-gradient(#102338,#0b1729);border-bottom:1px solid var(--line)}
.logo{font-size:15px;line-height:1}
h1{font-size:14px;margin:0;font-weight:700;letter-spacing:.2px;white-space:nowrap}
#status{margin-left:auto;font-size:11px;color:var(--muted);max-width:52vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:right}
main{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:7px;padding:7px;overflow-y:auto;overflow-x:hidden}
.topbar{flex:0 0 auto;display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.seg{display:flex;background:#0c1929;border:1px solid var(--line);border-radius:9px;padding:2px;gap:2px}
.seg button{border:0;background:transparent;color:var(--muted);padding:6px 10px;border-radius:7px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap}
.seg button.on{background:var(--accent);color:#fff}
.filebtn{position:relative;overflow:hidden;display:inline-flex;align-items:center;padding:6px 9px;border:1px solid var(--line);border-radius:7px;background:var(--panel2);font-size:11px;font-weight:600;color:#cfe0f5;cursor:pointer;white-space:nowrap}
.filebtn input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:0}
.filebtn:active{background:#1d3653}
#sample{margin-left:auto;border:1px solid var(--line);background:var(--panel2);color:#cfe0f5;border-radius:7px;padding:6px 9px;font-size:11px;font-weight:600;cursor:pointer}
#scoreView{position:relative;flex:1 1 auto;min-height:190px;background:#fff;border:1px solid #24405f;border-radius:10px;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;touch-action:pan-y}
#scoreSpacer{width:1px;pointer-events:none}
#scoreStage{position:absolute;top:0;left:0;width:100%;transform-origin:0 0;transition:transform .18s ease-out;background:#fff;will-change:transform}
#scoreInner{width:100%;position:relative}
#scoreInner svg{display:block}
#measureHl{position:absolute;left:0;top:0;width:0;height:0;border-radius:3px;background:rgba(47,134,216,.09);box-shadow:inset 0 0 0 1px rgba(47,134,216,.35);pointer-events:none;opacity:0;transition:left .14s,top .14s,width .14s,height .14s,opacity .14s;z-index:2}
.transport{flex:0 0 auto;display:flex;align-items:center;gap:9px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:7px 9px}
#play{flex:0 0 auto;width:50px;height:50px;border-radius:50%;border:0;background:var(--accent);color:#fff;font-size:19px;display:grid;place-items:center;cursor:pointer;box-shadow:0 4px 12px rgba(47,134,216,.35)}
#play:active{transform:scale(.96)}
#stop{flex:0 0 auto;width:42px;height:42px;border-radius:50%;border:1px solid #2a4a6d;background:#1a3050;color:#dbe9fa;font-size:15px;display:grid;place-items:center;cursor:pointer}
.time{flex:1 1 auto;min-width:0}
.tline{display:flex;align-items:baseline;gap:8px;font-size:11px;color:var(--muted)}
#posBar{font-weight:700;color:#dceafb;font-size:13px;white-space:nowrap}
#posTime{margin-left:auto;font-variant-numeric:tabular-nums;white-space:nowrap}
.progwrap{margin-top:5px;height:16px;display:flex;align-items:center;cursor:pointer}
.progtrack{position:relative;height:5px;width:100%;background:#1b3149;border-radius:3px;overflow:hidden}
#progFill{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,#2f86d8,#39b3a8);border-radius:3px}
details.sect{flex:0 0 auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
summary{list-style:none;padding:9px 11px;font-size:12.5px;font-weight:700;color:#cfe0f5;cursor:pointer;display:flex;align-items:center;gap:6px;user-select:none}
summary::-webkit-details-marker{display:none}
summary .arrow{margin-left:auto;color:var(--muted);font-size:10px;transition:transform .15s}
details[open] summary .arrow{transform:rotate(180deg)}
.sectbad{padding:0 11px 10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.field{display:flex;flex-direction:column;gap:3px;font-size:11.5px;color:var(--muted);min-width:0}
.field b{color:#dceafb;font-weight:700}
.field.wide{grid-column:1/-1}
.field input[type=range]{width:100%;margin:0}
input[type=range]{-webkit-appearance:none;appearance:none;height:20px;background:transparent;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:4px;background:#20364f;border-radius:2px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:17px;height:17px;margin-top:-6.5px;border-radius:50%;background:var(--accent);border:2px solid #0a1626}
input[type=range]::-moz-range-track{height:4px;background:#20364f;border-radius:2px}
input[type=range]::-moz-range-thumb{width:15px;height:15px;border:2px solid #0a1626;border-radius:50%;background:var(--accent)}
.switch{position:relative;display:inline-block;width:44px;height:24px;flex:0 0 auto}
.switch input{opacity:0;width:0;height:0;position:absolute}
.switch .knob{position:absolute;inset:0;background:#22384f;border-radius:12px;transition:.16s;cursor:pointer}
.switch .knob:before{content:"";position:absolute;width:18px;height:18px;left:3px;top:3px;background:#8fa7c2;border-radius:50%;transition:.16s}
.switch input:checked + .knob{background:var(--accent2)}
.switch input:checked + .knob:before{transform:translateX(20px);background:#fff}
.looprow{display:flex;align-items:center;gap:8px;flex-direction:row}
.barinputs{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.barinputs label{display:flex;align-items:center;gap:4px;font-size:11.5px;color:var(--muted);white-space:nowrap}
input[type=number]{width:52px;background:#0d1c2e;border:1px solid var(--line);border-radius:6px;color:var(--text);padding:5px 6px;font-size:12px;text-align:center}
.mini{border:1px solid var(--line);background:#1a3050;color:#a9c3e0;border-radius:6px;padding:4px 6px;font-size:10.5px;font-weight:700;cursor:pointer}
.tracks{display:flex;flex-direction:column}
.track{display:grid;grid-template-columns:1fr auto;gap:2px 8px;align-items:center;padding:7px 0;border-top:1px solid #17293f}
.track:first-child{border-top:0;padding-top:2px}
.tname{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.tbtns{display:flex;gap:4px}
.tbtn{width:30px;height:28px;border-radius:6px;border:1px solid #2a4a6d;background:#16293f;color:#cfe0f5;font-size:11px;font-weight:700;cursor:pointer;padding:0}
.tbtn.on{background:var(--accent);border-color:var(--accent);color:#fff}
.tbtn.s.on{background:var(--accent2);border-color:var(--accent2)}
.tbtn.eye{font-size:13px}
.tbtn.eye.off{opacity:.4}
.track input[type=range]{grid-column:1/-1;width:100%}
.note{color:var(--muted);font-size:11px;margin:8px 0 0}
@media(min-width:760px){
  main{max-width:1180px;width:100%;margin:0 auto;padding:10px}
  .grid{grid-template-columns:repeat(4,1fr)}
  .field.wide{grid-column:auto}
  #scoreView{min-height:320px}
}
@media(min-width:760px) and (max-height:520px){ #scoreView{min-height:170px} }
</style>
</head>
<body>
<header>
  <span class="logo">🎼</span>
  <h1>합주 연습</h1>
  <span id="status">불러오는 중…</span>
</header>
<main>
  <div class="topbar">
    <div class="seg" role="group" aria-label="악보 보기 모드">
      <button id="btnLine" class="on" type="button">한 줄 보기</button>
      <button id="btnWhole" type="button">전체 보기</button>
    </div>
    <label class="filebtn">악보 선택<input id="xmlFile" type="file" accept=".musicxml,.xml,.mxl,application/vnd.recordare.musicxml+xml,application/xml"></label>
    <label class="filebtn">MIDI 선택<input id="midiFile" type="file" accept=".mid,.midi,audio/midi"></label>
    <button id="sample" type="button">샘플</button>
  </div>

  <div id="scoreView" aria-label="악보">
    <div id="scoreSpacer"></div>
    <div id="scoreStage">
      <div id="measureHl"></div>
      <div id="scoreInner"></div>
    </div>
  </div>

  <div class="transport">
    <button id="play" type="button" aria-label="재생">▶</button>
    <button id="stop" type="button" aria-label="정지">■</button>
    <div class="time">
      <div class="tline"><span id="posBar">1마디</span><span id="posTime">0:00.0 / 0:00.0</span></div>
      <div class="progwrap" id="progwrap"><div class="progtrack"><div id="progFill"></div></div></div>
    </div>
  </div>

  <details class="sect" id="sectPlay" open>
    <summary>재생 설정<span class="arrow">▾</span></summary>
    <div class="sectbad">
      <div class="grid">
        <label class="field"><span>속도 <b id="speedVal">100%</b></span><input id="speed" type="range" min="50" max="200" step="5" value="100"></label>
        <label class="field"><span>확대 <b id="zoomVal">100%</b></span><input id="zoom" type="range" min="60" max="200" step="10" value="100"></label>
        <div class="field looprow"><span>구간 반복</span><label class="switch"><input id="loop" type="checkbox"><span class="knob"></span></label></div>
        <div class="field wide">
          <div class="barinputs">
            <label>시작 <input id="startBar" type="number" min="1" value="1"><button id="setA" class="mini" type="button">현재</button></label>
            <label>끝 <input id="endBar" type="number" min="1" value="8"><button id="setB" class="mini" type="button">현재</button></label>
          </div>
        </div>
      </div>
    </div>
  </details>

  <details class="sect" id="sectTracks">
    <summary>악기별 설정 <span id="trackCount" style="color:#93a9c4;font-weight:600"></span><span class="arrow">▾</span></summary>
    <div class="sectbad">
      <div id="tracks" class="tracks"></div>
      <p class="note">M 음소거 · S 솔로 · 👁 악보 표시 · 슬라이더 음량</p>
    </div>
  </details>
</main>
<script src="https://cdn.jsdelivr.net/npm/opensheetmusicdisplay@1.9.2/build/opensheetmusicdisplay.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tonejs/midi@2.0.28/build/Midi.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tone@14.8.49/build/Tone.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script>
(function(){
'use strict';
var $=function(id){return document.getElementById(id)};
var ERR=[];
window.addEventListener('error',function(e){ERR.push(String(e.message||e.error));});
window.addEventListener('unhandledrejection',function(e){ERR.push('promise: '+String(e.reason));});

var S={
  osmd:null, sheet:null, midi:null,
  midiTracks:[], trackState:[], parts:[],
  measures:[], xmlTotalQ:0, midiTotalQ:0, ppq:480, tempo:100, xmlTempo:0,
  playing:false, seekQ:0, currentMeasure:0, view:'line', viewScale:1,
  lineSystems:[], sysIndex:null, boxes:[], zoom:1,
  audioBuilt:false, hudAt:0, fired:0, errors:ERR, ready:false,
  scoreName:'', midiName:''
};
S.sysIndex=new Map();
window.__practice={S:S,api:{}};

function status(t){ $('status').textContent=t; }
function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
function fmt(sec){
  if(!isFinite(sec)||sec<0) sec=0;
  var m=Math.floor(sec/60), s=sec-m*60;
  return m+':'+(s<10?'0':'')+s.toFixed(1);
}
function esc(x){ return String(x).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }

/* ---------- 오디오 ---------- */
var AU={ch:[],inst:[]};
function dbFor(v){ if(!v||v<=0) return -60; return Math.max(-60,20*Math.log10(Math.max(0.001,v/100))-4); }
function disposeAudio(){
  AU.inst.forEach(function(i){ try{ i.dispose(); }catch(e){} });
  AU.ch.forEach(function(c){ try{ c.dispose(); }catch(e){} });
  AU.inst=[]; AU.ch=[]; S.audioBuilt=false;
}
function makeInstrument(track,ch){
  if(track.channel===9){
    var kick=new Tone.MembraneSynth({pitchDecay:0.02,octaves:5,envelope:{attack:0.001,decay:0.26,sustain:0,release:0.12},volume:-3}).connect(ch);
    var snare=new Tone.NoiseSynth({noise:{type:'pink'},envelope:{attack:0.001,decay:0.15,sustain:0,release:0.06},volume:-9}).connect(ch);
    var hat=new Tone.MetalSynth({frequency:320,envelope:{attack:0.001,decay:0.05,release:0.02},harmonicity:6,modulationIndex:36,resonance:4800,octaves:1.2,volume:-17}).connect(ch);
    return {
      trigger:function(n,dur,time,vel){
        if(n===35||n===36) kick.triggerAttackRelease('C1',Math.min(0.6,Math.max(0.08,dur)),time,vel);
        else if(n===38||n===40||n===37) snare.triggerAttackRelease(Math.min(0.5,Math.max(0.05,dur)),time,vel);
        else if(n===42||n===44) hat.triggerAttackRelease(0.04,time,vel);
        else if(n===46) hat.triggerAttackRelease(0.12,time,vel);
        else if(n===49||n===51||n===57) hat.triggerAttackRelease(0.16,time,vel);
        else kick.triggerAttackRelease('C1',0.2,time,vel);
      },
      release:function(){ try{kick.triggerRelease();}catch(e){} },
      dispose:function(){ [kick,snare,hat].forEach(function(x){try{x.dispose();}catch(e){}}); }
    };
  }
  var prog=(track.instrument&&typeof track.instrument.number==='number')?track.instrument.number:0;
  var osc='triangle', env={attack:0.008,decay:0.18,sustain:0.5,release:0.9};
  if(prog>=32&&prog<=39){ osc='square'; env={attack:0.006,decay:0.12,sustain:0.32,release:0.45}; }
  else if(prog>=24&&prog<=31){ osc='sawtooth'; env={attack:0.005,decay:0.14,sustain:0.3,release:0.4}; }
  else if(prog>=16&&prog<=23){ osc='sine'; env={attack:0.02,decay:0.2,sustain:0.6,release:1.1}; }
  var poly=new Tone.PolySynth(Tone.Synth,{oscillator:{type:osc},envelope:env});
  poly.maxPolyphony=32;
  poly.volume.value=-8;
  poly.connect(ch);
  return {
    trigger:function(n,dur,time,vel){
      var f=Tone.Frequency(Math.round(n),'midi').toFrequency();
      poly.triggerAttackRelease(f,Math.max(0.06,dur),time,vel);
    },
    release:function(){ try{poly.releaseAll();}catch(e){} },
    dispose:function(){ try{poly.dispose();}catch(e){} }
  };
}
function buildAudio(){
  disposeAudio();
  if(!S.midiTracks.length) return;
  S.midiTracks.forEach(function(t,i){
    var ch=new Tone.Channel({volume:dbFor(S.trackState[i]?S.trackState[i].vol:80)}).toDestination();
    AU.ch.push(ch);
    AU.inst.push(makeInstrument(t,ch));
  });
  S.audioBuilt=true;
}
function soloOn(){ return S.trackState.some(function(t){return t.solo;}); }
function audible(i){
  var t=S.trackState[i]; if(!t) return false;
  if(t.mute) return false;
  return soloOn()? !!t.solo : true;
}
function releaseAll(){ AU.inst.forEach(function(i){ try{i.release();}catch(e){} }); }

/* ---------- 재생(Transport) ---------- */
function tppq(){ return Tone.Transport.PPQ||192; }
function toTicks(q){ return Math.round(q*tppq()); }
function speedFactor(){ return Number($('speed').value)/100; }
function totalQ(){ return S.midiTotalQ>0?S.midiTotalQ:(S.xmlTotalQ||0); }
function secPerQ(){ return 60/(S.tempo*speedFactor()); }
function measureStartQ(i){
  var m=S.measures[i];
  return m?m.startQ:totalQ();
}
function measureEndQ(i){
  var m=S.measures[i];
  if(!m) return totalQ();
  return m.startQ+m.durQ;
}
function measureIndexAtQ(q){
  var ms=S.measures, lo=0, hi=ms.length-1;
  if(!ms.length) return 0;
  if(q<=ms[0].startQ) return 0;
  while(lo<hi){ var mid=(lo+hi+1)>>1; if(ms[mid].startQ<=q+1e-6) lo=mid; else hi=mid-1; }
  return lo;
}
function loopAQ(){
  var i=clamp((parseInt($('startBar').value,10)||1)-1,0,Math.max(0,S.measures.length-1));
  return measureStartQ(i);
}
function loopBQ(){
  var i=clamp((parseInt($('endBar').value,10)||S.measures.length)-1,0,Math.max(0,S.measures.length-1));
  return measureEndQ(i);
}
function applyTempo(){
  if(window.Tone) Tone.Transport.bpm.value=S.tempo*speedFactor();
  applyLoopPoints();
}
function applyLoopPoints(){
  var on=$('loop').checked;
  var a=Math.max(0,loopAQ());
  var b=Math.max(a+0.25,Math.min(loopBQ(),totalQ()||a+4));
  Tone.Transport.loop=on;
  Tone.Transport.loopStart=String(toTicks(a))+'i';
  Tone.Transport.loopEnd=String(toTicks(b))+'i';
}
function scheduleAll(){
  Tone.Transport.cancel(0);
  if(!S.midi) return;
  var ppq=S.ppq||480;
  S.midiTracks.forEach(function(t,ti){
    t.notes.forEach(function(n){
      var q=n.ticks/ppq;
      var durQ=Math.max(n.durationTicks/ppq,0.04);
      var at=toTicks(q);
      Tone.Transport.schedule(function(time){
        if(!audible(ti)) return;
        S.fired++;
        var inst=AU.inst[ti];
        if(!inst) return;
        try{ inst.trigger(n.midi,durQ*secPerQ(),time,clamp(n.velocity||0.8,0.05,1)); }catch(e){}
      },String(at)+'i');
    });
  });
}
function resetTransport(){
  Tone.Transport.stop();
  Tone.Transport.cancel(0);
  S.playing=false;
  setPlayIcon(false);
  releaseAll();
}
function configureTransport(){
  resetTransport();
  scheduleAll();
  applyTempo();
}
function setPlayIcon(on){ $('play').textContent=on?'❚❚':'▶'; $('play').setAttribute('aria-label',on?'일시정지':'재생'); }

async function togglePlay(){
  if(!S.midi){ status('MIDI 파일을 함께 불러와 주세요'); return; }
  try{ await Tone.start(); }catch(e){}
  if(!S.audioBuilt) buildAudio();
  if(S.playing){ pausePlay(); return; }
  startPlay();
}
function startPlay(){
  var q=S.seekQ;
  if($('loop').checked){
    var a=loopAQ(), b=loopBQ();
    if(q<a-0.01||q>=b-0.01) q=a;
  }
  if(q>=totalQ()-0.01) q=$('loop').checked?loopAQ():0;
  try{ Tone.Transport.stop(); }catch(e){}
  Tone.Transport.bpm.value=S.tempo*speedFactor();
  try{ Tone.Transport.start(undefined,q*secPerQ()); }
  catch(e){ Tone.Transport.ticks=toTicks(q); Tone.Transport.start(); }
  S.playing=true; setPlayIcon(true);
  ensureFrame();
}
function pausePlay(){
  S.seekQ=clamp(Tone.Transport.ticks/tppq(),0,totalQ());
  try{ Tone.Transport.pause(); }catch(e){}
  S.playing=false; setPlayIcon(false);
  releaseAll();
  hud(S.seekQ,true);
}
function stopPlay(){
  S.playing=false; setPlayIcon(false);
  try{ Tone.Transport.stop(); }catch(e){}
  releaseAll();
  var q=$('loop').checked?loopAQ():measureStartQ(Math.max(0,(parseInt($('startBar').value,10)||1)-1));
  seekTo(q,true);
}

/* ---------- 악보 ---------- */
function decodeBytes(bytes){
  if(bytes.length>2&&bytes[0]===0xEF&&bytes[1]===0xBB&&bytes[2]===0xBF) bytes=bytes.subarray(3);
  var enc='utf-8';
  try{
    var head=new TextDecoder('latin1').decode(bytes.subarray(0,Math.min(400,bytes.length)));
    var m=/encoding\s*=\s*["']([A-Za-z0-9_-]+)["']/i.exec(head);
    if(m) enc=m[1].toLowerCase();
  }catch(e){}
  if(enc==='utf8') enc='utf-8';
  try{ return new TextDecoder(enc).decode(bytes); }
  catch(e){ return new TextDecoder('utf-8').decode(bytes); }
}
function b64ToBytes(b64){
  var bin=atob(b64.replace(/\s+/g,''));
  var out=new Uint8Array(bin.length);
  for(var i=0;i<bin.length;i++) out[i]=bin.charCodeAt(i);
  return out;
}
function decodeEntities(s){
  return String(s).replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&apos;/g,"'").replace(/&#(\d+);/g,function(_,d){return String.fromCharCode(+d);}).replace(/&amp;/g,'&');
}
function partNamesFromXml(text){
  var out=[], re=/<part-name[^>]*>([\s\S]*?)<\/part-name>/g, m;
  while((m=re.exec(text))) out.push(decodeEntities(m[1].replace(/<[^>]+>/g,'')).trim());

function buildGeometry(){
  var g=S.osmd&&(S.osmd.GraphicSheet||S.osmd.Graphic); if(!g) return;
  var z=(S.osmd&&S.osmd.zoom)||1;
  var list=g.MeasureList||[];
  S.boxes=[]; S.sysIndex=new Map(); S.lineSystems=[];
  var sysMap=new Map();
  list.forEach(function(staves,mi){
    var box=null, sys=null;
    (staves||[]).forEach(function(gm){
      if(!gm||!gm.PositionAndShape) return;
      var ps=gm.PositionAndShape;
      var b={x:ps.AbsolutePosition.x*10*z,y:ps.AbsolutePosition.y*10*z,w:ps.Size.width*10*z,h:ps.Size.height*10*z};
      if(!b.w||!b.h) return;
      if(!box) box={x:b.x,y:b.y,w:b.w,h:b.h};
      else{
        var x1=Math.min(box.x,b.x), y1=Math.min(box.y,b.y), x2=Math.max(box.x+box.w,b.x+b.w), y2=Math.max(box.y+box.h,b.y+b.h);
        box={x:x1,y:y1,w:x2-x1,h:y2-y1};
      }
      if(!sys) sys=gm.ParentMusicSystem;
    });
    if(!box) return;
    S.boxes.push({i:mi,x:box.x,y:box.y,w:box.w,h:box.h});
    if(sys){
      if(!sysMap.has(sys)) sysMap.set(sys,{x:box.x,y:box.y,w:box.w,h:box.h,measures:[mi]});
      else{
        var s2=sysMap.get(sys);
        var sx1=Math.min(s2.x,box.x), sy1=Math.min(s2.y,box.y), sx2=Math.max(s2.x+s2.w,box.x+box.w), sy2=Math.max(s2.y+s2.h,box.y+box.h);

      }
    }
  });
  /* 한 줄 보기는 시스템 전체 상자(파트 이름 포함)를 기준으로 자른다 */
  sysMap.forEach(function(s3,sys){
    try{
      var sp=sys.PositionAndShape;
      if(!sp||!sp.Size.width||!sp.Size.height) return;
      s3.x=sp.AbsolutePosition.x*10*z;
      s3.y=sp.AbsolutePosition.y*10*z;
      s3.w=sp.Size.width*10*z;
      s3.h=sp.Size.height*10*z;

function applyView(align){
  var vp=$('scoreView'), stage=$('scoreStage'), inner=$('scoreInner'), spacer=$('scoreSpacer');

    ty=(chh<=availH)?(pad+(availH-chh)/2-sys.y*sc):(pad-sys.y*sc);

    sh=Math.max(chh+pad*2,vh);

function hitMeasure(x,y){
  if(!S.boxes.length) return null;
  var best=null;
  for(var i=0;i<S.boxes.length;i++){
    var b=S.boxes[i];
    if(y>=b.y-b.h*0.12&&y<=b.y+b.h*1.12){
      if(x>=b.x-6&&x<=b.x+b.w+6) return b.i;
      var d=Math.abs(x-(b.x+b.w/2));
      if(!best||d<best.d) best={i:b.i,d:d};
    }
  }
  if(best) return best.i;
  for(var j=0;j<S.boxes.length;j++){
    var c=S.boxes[j], cy=c.y+c.h/2, cx=c.x+c.w/2;
    var dist=Math.abs(y-cy)*2+Math.abs(x-cx);
    if(!best||dist<best.d) best={i:c.i,d:dist};
  }
  return best?best.i:null;
}

  applyLoopPoints();

}
