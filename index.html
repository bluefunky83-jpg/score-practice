<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>합주 연습 플레이어 · 데모</title><style>body{margin:0;background:#0c1524;color:#e7efff;font-family:system-ui,sans-serif}header{padding:16px 22px;background:#14243b;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px}h1{font-size:19px;margin:0}.sub{color:#9eafc8;font-size:12px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:14px;padding:14px;max-width:1500px;margin:auto}.panel{background:#182840;border:1px solid #30425e;border-radius:13px;padding:14px}.score{background:#fff;color:#152238;border-radius:8px;overflow:auto;max-height:72vh;padding:8px}.controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:12px 0}button,input,select{font:inherit}button{border:1px solid #557094;border-radius:8px;background:#263c5b;color:white;padding:9px 13px;cursor:pointer}button.primary{background:#2774c9;border-color:#2774c9}button.active{background:#1b8c7c}input[type=range]{max-width:100%}.track{border-top:1px solid #324661;padding:11px 0}.trackline{display:flex;align-items:center;justify-content:space-between;gap:8px}.track label{font-size:13px}.pill{font-size:12px;padding:5px 8px}.status{font-size:12px;color:#a8c4ed}#score svg{max-width:none}.note{color:#93a9c9;font-size:12px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}input[type=file]{max-width:230px;font-size:12px}select{background:#253d60;color:white;border:1px solid #587295;padding:7px;border-radius:7px}@media(max-width:850px){.layout{grid-template-columns:1fr}.score{max-height:60vh}} </style></head><body><header><div><h1>🎼 합주 연습 플레이어</h1><div class="sub">FEAT.BAND 스타일 · 개인용 기능 테스트</div></div><span class="status" id="status">샘플 불러오는 중…</span></header><main class="layout"><section class="panel"><div class="row"><label>MusicXML <input id="xmlFile" type="file" accept=".musicxml,.xml,.mxl"></label><label>MIDI <input id="midiFile" type="file" accept=".mid,.midi"></label><button id="sample">샘플 다시 열기</button></div><div class="controls"><button class="primary" id="play">▶ 재생</button><button id="stop">■ 정지</button><label>속도 <select id="speed"><option value="0.5">50%</option><option value="0.75">75%</option><option value="1" selected>100%</option><option value="1.25">125%</option><option value="1.5">150%</option><option value="2">200%</option></select></label><label>확대 <select id="zoom"><option value="0.7">70%</option><option value="0.85">85%</option><option value="1" selected>100%</option><option value="1.25">125%</option><option value="1.5">150%</option></select></label></div><div class="controls"><label>시작 마디 <input type="number" id="startBar" min="1" value="1" style="width:52px"></label><label><input type="checkbox" id="loop"> 구간 반복</label><label>끝 마디 <input type="number" id="endBar" min="1" value="8" style="width:52px"></label><span id="position" class="status">1마디</span></div><div class="score" id="score"><div id="scoreInner"></div></div><p class="note">악보는 MusicXML, 소리는 MIDI 기준이야. 파일이 서로 다르면 재생 위치가 어긋날 수 있어. 샘플은 8마디 오리지널 합주곡이야.</p></section><aside class="panel"><h3 style="margin-top:0">악기별 연습</h3><div class="note">M = 음소거, S = 솔로, 눈 = 악보 표시</div><div id="tracks"></div><p class="note">현재 음색은 브라우저 내장 신시사이저 기반의 간단한 데모 소리야. 실제 악기 음원은 다음 단계에서 개선할 수 있어.</p><p class="note">이 버전은 로그인·Google Drive 연동 전의 기능 시험판이야. 악보 파일은 이 화면에서만 불러와.</p></aside></main><script src="https://cdn.jsdelivr.net/npm/opensheetmusicdisplay@1.9.2/build/opensheetmusicdisplay.min.js"></script><script src="https://cdn.jsdelivr.net/npm/@tonejs/midi@2.0.28/build/Midi.js"></script><script src="https://cdn.jsdelivr.net/npm/tone@14.8.49/build/Tone.js"></script><script>
let osmd,midi,trackState=[],synths=[],playing=false,elapsed=0,started=0,timer=null,scheduled=[],duration=0,tempo=100;const $=id=>document.getElementById(id);function status(t){$('status').textContent=t}function speed(){return Number($('speed').value)}function soloed(){return trackState.some(x=>x.solo)}function audible(i){return !trackState[i]?.mute&&(!soloed()||trackState[i]?.solo)}
async function loadXML(content){try{if(!window.opensheetmusicdisplay)throw Error('악보 라이브러리를 불러오지 못했어');osmd=new opensheetmusicdisplay.OpenSheetMusicDisplay('scoreInner',{autoResize:true,drawTitle:true});await osmd.load(content);osmd.Zoom=Number($('zoom').value);osmd.render();osmd.cursor.show();osmd.cursor.reset();status('악보 준비 완료')}catch(e){status('악보 오류: '+e.message)}}
async function loadMIDI(buffer){try{if(!window.Midi)throw Error('MIDI 라이브러리를 불러오지 못했어');stop();midi=new Midi(buffer);duration=midi.duration;tempo=midi.header.tempos[0]?.bpm||100;trackState=midi.tracks.map((t,i)=>({name:t.name||['키보드','기타','베이스','드럼'][i]||'파트 '+(i+1),mute:false,solo:false,visible:true,vol:80}));synths.forEach(s=>s.dispose());synths=midi.tracks.map((t,i)=>{let s=(t.channel===9?new Tone.MembraneSynth():new Tone.PolySynth(Tone.Synth)).toDestination();s.volume.value=-8;return s});renderTracks();$('endBar').value=Math.ceil(duration/(60/tempo*4));status('MIDI 준비 완료 · '+midi.tracks.length+'파트')}catch(e){status('MIDI 오류: '+e.message)}}
function renderTracks(){let el=$('tracks');el.innerHTML='';trackState.forEach((t,i)=>{let d=document.createElement('div');d.className='track';d.innerHTML=`<div class="trackline"><strong>${escapeHtml(t.name)}</strong><div><button class="pill ${t.mute?'active':''}" data-a="mute">M</button> <button class="pill ${t.solo?'active':''}" data-a="solo">S</button> <button class="pill" data-a="visible">${t.visible?'👁':'—'}</button></div></div><label>음량 <input data-a="vol" type="range" min="0" max="100" value="${t.vol}"></label>`;d.querySelectorAll('[data-a]').forEach(b=>{let a=b.dataset.a;if(a==='vol')b.oninput=()=>{t.vol=Number(b.value)};else b.onclick=()=>{t[a]=!t[a];renderTracks();if(a==='visible')setPartVisibility()}});el.append(d)})}
function escapeHtml(x){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function setPartVisibility(){if(!osmd)return;try{const list=osmd.Sheet.Instruments;list.forEach((ins,i)=>{ins.Visible=trackState[i]?.visible!==false});osmd.render();osmd.cursor.show()}catch(e){status('파트 표시 변경 제한: '+e.message)}}
function stop(){playing=false;clearInterval(timer);scheduled.forEach(clearTimeout);scheduled=[];synths.forEach(s=>{try{s.releaseAll?.()}catch(e){}});$('play').textContent='▶ 재생'}
function barSec(){return 4*60/tempo}function loopStart(){return (Math.max(1,Number($('startBar').value)||1)-1)*barSec()}function loopEnd(){return Math.min(duration,Math.max(1,Number($('endBar').value)||1)*barSec())}
function updateCursor(t){let bar=Math.max(1,Math.floor(t/barSec())+1);$('position').textContent=bar+'마디 · '+t.toFixed(1)+'초';if(!osmd)return;try{osmd.cursor.reset();for(let i=1;i<bar;i++)osmd.cursor.next();osmd.cursor.show();let e=osmd.cursor.cursorElement;e?.scrollIntoView({block:'center',behavior:'smooth'})}catch(e){}}
function scheduleFrom(at){scheduled.forEach(clearTimeout);scheduled=[];if(!midi)return;let end=$('loop').checked?loopEnd():duration;for(let i=0;i<midi.tracks.length;i++){for(let n of midi.tracks[i].notes){if(n.time<at||n.time>=end)continue;let id=setTimeout(()=>{if(!playing||!audible(i))return;let s=synths[i];s.volume.value=toneDb(trackState[i].vol);try{if(midi.tracks[i].channel===9)s.triggerAttackRelease('C2',Math.max(.04,n.duration/speed()),undefined,Math.max(.1,n.velocity));else s.triggerAttackRelease(Tone.Frequency(n.midi,'midi'),Math.max(.04,n.duration/speed()),undefined,Math.max(.1,n.velocity))}catch(e){}},Math.max(0,(n.time-at)/speed()*1000));scheduled.push(id)}}}
function toneDb(v){return v<=0?-90:20*Math.log10(v/100)-7}
async function play(){if(!midi){status('먼저 MIDI를 불러와 줘');return}await Tone.start();if(playing){elapsed=Math.min(duration,elapsed+(performance.now()-started)/1000*speed());stop();return}if(elapsed>=duration)elapsed=loopStart();if(elapsed===0)elapsed=loopStart();playing=true;started=performance.now();$('play').textContent='Ⅱ 일시정지';scheduleFrom(elapsed);timer=setInterval(()=>{let t=elapsed+(performance.now()-started)/1000*speed();let end=$('loop').checked?loopEnd():duration;if(t>=end){stop();if($('loop').checked){elapsed=loopStart();play()}else{elapsed=0;updateCursor(0)}return}updateCursor(t)},100)}
$('play').onclick=play;$('stop').onclick=()=>{stop();elapsed=0;updateCursor(0)};$('speed').onchange=()=>{if(playing){elapsed+=(performance.now()-started)/1000*speed();stop();play()}};$('zoom').onchange=()=>{if(osmd){osmd.Zoom=Number($('zoom').value);osmd.render();osmd.cursor.show()}};$('startBar').onchange=()=>{stop();elapsed=loopStart();updateCursor(elapsed)};$('xmlFile').onchange=async e=>{let f=e.target.files[0];if(f)await loadXML(f.name.endsWith('.mxl')?f:await f.text())};$('midiFile').onchange=async e=>{let f=e.target.files[0];if(f)await loadMIDI(await f.arrayBuffer())};async function sample(){try{let x=atob('PD94bWwgdmVyc2lvbj0iMS4wIiBlbmNvZGluZz0idXRmLTgiPz4KPCFET0NUWVBFIHNjb3JlLXBhcnR3aXNlICBQVUJMSUMgIi0vL1JlY29yZGFyZS8vRFREIE11c2ljWE1MIDQuMCBQYXJ0d2lzZS8vRU4iICJodHRwOi8vd3d3Lm11c2ljeG1sLm9yZy9kdGRzL3BhcnR3aXNlLmR0ZCI+CjxzY29yZS1wYXJ0d2lzZSB2ZXJzaW9uPSI0LjAiPjx3b3JrPjx3b3JrLXRpdGxlPu2VqeyjvCDsl7DsirUg7IOY7ZSMPC93b3JrLXRpdGxlPjwvd29yaz48bW92ZW1lbnQtdGl0bGU+7ZWp7KO8IOyXsOyKtSDsg5jtlIw8L21vdmVtZW50LXRpdGxlPjxpZGVudGlmaWNhdGlvbj48Y3JlYXRvciB0eXBlPSJjb21wb3NlciI+T3JpZ2luYWwgcHJhY3RpY2UgZGVtbzwvY3JlYXRvcj48L2lkZW50aWZpY2F0aW9uPjxkZWZhdWx0cz48c2NhbGluZz48bWlsbGltZXRlcnM+NzwvbWlsbGltZXRlcnM+PHRlbnRocz40MDwvdGVudGhzPjwvc2NhbGluZz48L2RlZmF1bHRzPjxwYXJ0LWxpc3Q+CjxzY29yZS1wYXJ0IGlkPSJQMSI+PHBhcnQtbmFtZT7tgqTrs7Trk5w8L3BhcnQtbmFtZT48cGFydC1hYmJyZXZpYXRpb24+7YKk67O065OcPC9wYXJ0LWFiYnJldmlhdGlvbj48c2NvcmUtaW5zdHJ1bWVudCBpZD0iSVAxIj48aW5zdHJ1bWVudC1uYW1lPu2CpOuztOuTnDwvaW5zdHJ1bWVudC1uYW1lPjwvc2NvcmUtaW5zdHJ1bWVudD48bWlkaS1pbnN0cnVtZW50IGlkPSJJUDEiPjxtaWRpLWNoYW5uZWw+MTwvbWlkaS1jaGFubmVsPjxtaWRpLXByb2dyYW0+MTwvbWlkaS1wcm9ncmFtPjwvbWlkaS1pbnN0cnVtZW50Pjwvc2NvcmUtcGFydD4KPHNjb3JlLXBhcnQgaWQ9IlAyIj48cGFydC1uYW1lPuq4sO2DgDwvcGFydC1uYW1lPjxwYXJ0LWFiYnJldmlhdGlvbj7quLDtg4A8L3BhcnQtYWJicmV2aWF0aW9uPjxzY29yZS1pbnN0cnVtZW50IGlkPSJJUDIiPjxpbnN0cnVtZW50LW5hbWU+6riw7YOAPC9pbnN0cnVtZW50LW5hbWU+PC9zY29yZS1pbnN0cnVtZW50PjxtaWRpLWluc3RydW1lbnQgaWQ9IklQMiI+PG1pZGktY2hhbm5lbD4yPC9taWRpLWNoYW
